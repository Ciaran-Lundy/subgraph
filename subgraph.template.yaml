          handler: callScheduled
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: CallExecuted(indexed bytes32,indexed uint256,address,uint256,bytes)
          handler: callExecuted
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: Cancelled(indexed bytes32)
          handler: cancelled
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: MinDelayChange(uint256,uint256)
          handler: minDelayChange
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
{{/if}}
