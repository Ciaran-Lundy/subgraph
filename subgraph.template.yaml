###############################################################################
templates:
  - kind: ethereum/contract
    name: Poll
    network: {{networkName}}
    source:
      abi: Poll
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/poll.ts
      abis:
        - name: Poll
          file: ./abis/Poll.json
        - name: BondingManager
          file: ./abis/BondingManager.json
        - name: RoundsManager
          file: ./abis/RoundsManager.json
      entities:
        - Transaction
        - Protocol
        - Round
        - Poll
        - PollTally
        - Vote
        - LivepeerAccount
        - Delegator
        - Transcoder
        - VoteEvent
      eventHandlers:
        - event: Vote(indexed address,uint256)
          handler: vote
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
