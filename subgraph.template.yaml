specVersion: 1.3.0
description: A protocol for affordable and reliable video encoding. Find transcoders, delegators, earning pools, and staking rounds.
repository: https://github.com/livepeer/subgraph
schema:
  file: ./schema.graphql
{{#if graft}}
# Hotfix deployments: set graft.base (deployment ID) and graft.block in
# networks.yaml to continue from an existing deployment instead of
# re-indexing from genesis. Remove it again for the next full deployment.
features:
  - grafting
graft:
  base: {{graft.base}}
  block: {{graft.block}}
{{/if}}
# Pruning (indexerHints.prune) is intentionally not enabled: the Explorer's
# protocolByBlock query reads historical state with a block argument. Confirm
# the time-travel range consumers need before adding, for example:
# indexerHints:
#   prune: <history_blocks>
dataSources:
  - kind: ethereum/contract
    name: BondingManager
    network: {{networkName}}
    source:
      startBlock: {{contracts.bondingManager.startBlock}}
      address: {{contracts.bondingManager.address}}
      abi: BondingManager
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/bondingManager.ts
      abis:
        - name: BondingManager
          file: ./abis/BondingManager.json
        - name: RoundsManager
          file: ./abis/RoundsManager.json
      entities:
          - BondEvent
          - Poll
          - PollTally
          - Vote
          - TransferBondEvent
          - Delegator
          - LivepeerAccount
          - EarningsClaimedEvent
          - ParameterUpdateEvent
          - Pool
          - Protocol
          - RebondEvent
          - RewardCallerSetEvent
          - RewardEvent
          - Transaction
          - Transcoder
          - TranscoderActivatedEvent
          - TranscoderDeactivatedEvent
          - TranscoderSlashedEvent
          - TranscoderUpdateEvent
          - TreasuryRewardEvent
          - SetControllerEvent
          - UnbondEvent
          - UnbondingLock
          - WithdrawFeesEvent
          - WithdrawStakeEvent
      eventHandlers:
        - event: TranscoderUpdate(indexed address,uint256,uint256)
          handler: transcoderUpdate
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: TranscoderActivated(indexed address,uint256)
          handler: transcoderActivated
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: TranscoderDeactivated(indexed address,uint256)
          handler: transcoderDeactivated
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: EarningsClaimed(indexed address,indexed address,uint256,uint256,uint256,uint256)
          handler: earningsClaimed
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: Bond(indexed address,indexed address,indexed address,uint256,uint256)
          handler: bond
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
            newDelegateDelegator: BondingManager[event.address].getDelegator(event.params.newDelegate)
            delegatorDelegator: BondingManager[event.address].getDelegator(event.params.delegator)
        - event: Unbond(indexed address,indexed address,uint256,uint256,uint256)
          handler: unbond
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
            delegateDelegator: BondingManager[event.address].getDelegator(event.params.delegate)
            delegatorDelegator: BondingManager[event.address].getDelegator(event.params.delegator)
        - event: Rebond(indexed address,indexed address,uint256,uint256)
          handler: rebond
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
            delegateDelegator: BondingManager[event.address].getDelegator(event.params.delegate)
            delegatorDelegator: BondingManager[event.address].getDelegator(event.params.delegator)
        - event: WithdrawStake(indexed address,uint256,uint256,uint256)
          handler: withdrawStake
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: Reward(indexed address,uint256)
          handler: reward
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: RewardCallerSet(indexed address,indexed address)
          handler: rewardCallerSet
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: WithdrawFees(indexed address,address,uint256)
          handler: withdrawFees
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
            delegatorDelegator: BondingManager[event.address].getDelegator(event.params.delegator)
        - event: ParameterUpdate(string)
          handler: parameterUpdate
          receipt: true
          calls:
            unbondingPeriod: BondingManager[event.address].unbondingPeriod()
            poolMaxSize: BondingManager[event.address].getTranscoderPoolMaxSize()
        - event: TransferBond(indexed address,indexed address,uint256,uint256,uint256)
          handler: transferBond
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: TranscoderSlashed(indexed address,address,uint256,uint256)
          handler: transcoderSlashed
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
            transcoderDelegator: BondingManager[event.address].getDelegator(event.params.transcoder)
        - event: TreasuryReward(indexed address,address,uint256)
          handler: treasuryReward
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: SetController(address)
          handler: setController
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
  - kind: ethereum/contract
    name: L2Migrator
    network: {{networkName}}
    source:
      startBlock: {{contracts.l2Migrator.startBlock}}
      address: {{contracts.l2Migrator.address}}
      abi: L2Migrator
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/l2Migrator.ts
      abis:
        - name: L2Migrator
          file: ./abis/L2Migrator.json
        - name: RoundsManager
          file: ./abis/RoundsManager.json
      entities:
        - MigrateDelegatorFinalizedEvent
        - MigrateSenderFinalizedEvent
        - MigrateUnbondingLocksFinalizedEvent
        - DelegatorPoolCreatedEvent
        - StakeClaimedEvent
        - Transaction
      eventHandlers:
        - event: MigrateDelegatorFinalized((address,address,uint256,uint256,uint256,address))
          handler: migrateDelegatorFinalized
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: MigrateSenderFinalized((address,address,uint256,uint256))
          handler: migrateSenderFinalized
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: MigrateUnbondingLocksFinalized((address,address,uint256,uint256[],address))
          handler: migrateUnbondingLocksFinalized
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: DelegatorPoolCreated(indexed address,address)
          handler: delegatorPoolCreated
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: StakeClaimed(indexed address,address,uint256,uint256)
          handler: stakeClaimed
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
  - kind: ethereum/contract
    name: RoundsManager
    network: {{networkName}}
    source:
      startBlock: {{contracts.roundsManager.startBlock}}
      address: {{contracts.roundsManager.address}}
      abi: RoundsManager
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/roundsManager.ts
      abis:
        - name: RoundsManager
          file: ./abis/RoundsManager.json
        - name: BondingManager
          file: ./abis/BondingManager.json
        - name: LivepeerToken
          file: ./abis/LivepeerToken.json
        - name: UniswapV3Pool
          file: ./abis/UniswapV3Pool.json
      entities:
        - Day
        - NewRoundEvent
        - ParameterUpdateEvent
        - Pool
        - Protocol
        - Round
        - Transaction
        - Transcoder
      eventHandlers:
        - event: NewRound(indexed uint256,bytes32)
          handler: newRound
          receipt: true
          calls:
            blockNum: RoundsManager[event.address].blockNum()
            firstTranscoder: BondingManager[0x{{contracts.bondingManager.address}}].getFirstTranscoderInPool()
            totalBonded: BondingManager[0x{{contracts.bondingManager.address}}].getTotalBonded()
{{#if uniswapV3Pools.lptEth}}
            lptEthSlot0: UniswapV3Pool[0x{{uniswapV3Pools.lptEth}}].slot0()
{{/if}}
        - event: ParameterUpdate(string)
          handler: parameterUpdate
          receipt: true
          calls:
            currentRound: RoundsManager[event.address].currentRound()
            roundLength: RoundsManager[event.address].roundLength()
            lastRoundLengthUpdateStartBlock: RoundsManager[event.address].lastRoundLengthUpdateStartBlock()
            lastRoundLengthUpdateRound: RoundsManager[event.address].lastRoundLengthUpdateRound()
            roundLockAmount: RoundsManager[event.address].roundLockAmount()
  - kind: ethereum/contract
    name: MinterV1
    network: {{networkName}}
    source:
      startBlock: {{contracts.minterV1.startBlock}}
      address: {{contracts.minterV1.address}}
{{#if contracts.minterV1.endBlock}}
      endBlock: {{contracts.minterV1.endBlock}}
{{/if}}
      abi: Minter
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/minter.ts
      abis:
        - name: Minter
          file: ./abis/Minter.json
        - name: RoundsManager
          file: ./abis/RoundsManager.json
      entities:
        - Round
        - Transaction
        - Protocol
        - ParameterUpdateEvent
        - SetCurrentRewardTokensEvent
        - SetControllerEvent
      eventHandlers:
        - event: SetCurrentRewardTokens(uint256,uint256)
          handler: setCurrentRewardTokens
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
            targetBondingRate: Minter[event.address].targetBondingRate()
            inflationChange: Minter[event.address].inflationChange()
            inflation: Minter[event.address].inflation()
        - event: ParameterUpdate(string)
          handler: parameterUpdate
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
            targetBondingRate: Minter[event.address].targetBondingRate()
            inflationChange: Minter[event.address].inflationChange()
        - event: SetController(address)
          handler: setController
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
  - kind: ethereum/contract
    name: Minter
    network: {{networkName}}
    source:
      startBlock: {{contracts.minter.startBlock}}
      address: {{contracts.minter.address}}
      abi: Minter
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/minter.ts
      abis:
        - name: Minter
          file: ./abis/Minter.json
        - name: RoundsManager
          file: ./abis/RoundsManager.json
      entities:
        - Round
        - Transaction
        - Protocol
        - ParameterUpdateEvent
        - SetCurrentRewardTokensEvent
        - SetControllerEvent
      eventHandlers:
        - event: SetCurrentRewardTokens(uint256,uint256)
          handler: setCurrentRewardTokens
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
            targetBondingRate: Minter[event.address].targetBondingRate()
            inflationChange: Minter[event.address].inflationChange()
            inflation: Minter[event.address].inflation()
        - event: ParameterUpdate(string)
          handler: parameterUpdate
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
            targetBondingRate: Minter[event.address].targetBondingRate()
            inflationChange: Minter[event.address].inflationChange()
        - event: SetController(address)
          handler: setController
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
  - kind: ethereum/contract
    name: TicketBroker
    network: {{networkName}}
    source:
      startBlock: {{contracts.ticketBroker.startBlock}}
      address: {{contracts.ticketBroker.address}}
      abi: TicketBroker
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/ticketBroker.ts
      abis:
        - name: TicketBroker
          file: ./abis/TicketBroker.json
        - name: UniswapV3Pool
          file: ./abis/UniswapV3Pool.json
        - name: RoundsManager
          file: ./abis/RoundsManager.json
      entities:
        - Transaction
        - Day
        - Protocol
        - Transcoder
        - Broadcaster
        - Round
        - WinningTicketRedeemedEvent
        - WinningTicketTransferEvent
        - ReserveFundedEvent
        - ReserveClaimedEvent
        - DepositFundedEvent
        - WithdrawalEvent
        - UnlockEvent
        - UnlockCancelledEvent
        - ParameterUpdateEvent
        - SetControllerEvent
      eventHandlers:
        - event: WinningTicketRedeemed(indexed address,indexed address,uint256,uint256,uint256,uint256,bytes)
          handler: winningTicketRedeemed
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
{{#if uniswapV3Pools.daiEth}}
            daiEthSlot0: UniswapV3Pool[0x{{uniswapV3Pools.daiEth}}].slot0()
{{/if}}
        - event: WinningTicketTransfer(indexed address,indexed address,uint256)
          handler: winningTicketTransfer
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: DepositFunded(indexed address,uint256)
          handler: depositFunded
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: ReserveFunded(indexed address,uint256)
          handler: reserveFunded
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: ReserveClaimed(indexed address,address,uint256)
          handler: reserveClaimed
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: Withdrawal(indexed address,uint256,uint256)
          handler: withdrawal
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: Unlock(indexed address,uint256,uint256)
          handler: unlock
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: UnlockCancelled(indexed address)
          handler: unlockCancelled
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: ParameterUpdate(string)
          handler: parameterUpdate
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: SetController(address)
          handler: setController
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
  - kind: ethereum/contract
    name: Controller
    network: {{networkName}}
    source:
      startBlock: {{contracts.controller.startBlock}}
      address: {{contracts.controller.address}}
      abi: Controller
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/controller.ts
      abis:
        - name: Controller
          file: ./abis/Controller.json
        - name: RoundsManager
          file: ./abis/RoundsManager.json
      entities:
        - PauseEvent
        - UnpauseEvent
        - SetContractInfoEvent
        - Protocol
        - Round
        - Transaction
      eventHandlers:
        - event: Pause()
          handler: pause
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: Unpause()
          handler: unpause
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: SetContractInfo(bytes32,address,bytes20)
          handler: setContractInfo
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
  - kind: ethereum/contract
    name: PollCreator
    network: {{networkName}}
    source:
      startBlock: {{contracts.pollCreator.startBlock}}
      address: {{contracts.pollCreator.address}}
      abi: PollCreator
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/pollCreator.ts
      abis:
        - name: PollCreator
          file: ./abis/PollCreator.json
        - name: RoundsManager
          file: ./abis/RoundsManager.json
      entities:
        - Transaction
        - Protocol
        - Poll
        - PollCreatedEvent
      eventHandlers:
        - event: PollCreated(indexed address,bytes,uint256,uint256,uint256)
          handler: pollCreated
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
  - kind: ethereum/contract
    name: Treasury
    network: {{networkName}}
    source:
      startBlock: {{contracts.livepeerGovernor.startBlock}}
      address: {{contracts.livepeerGovernor.address}}
      abi: LivepeerGovernor
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/treasury.ts
      abis:
        - name: LivepeerGovernor
          file: ./abis/LivepeerGovernor.json
        - name: RoundsManager
          file: ./abis/RoundsManager.json
      entities:
        - TreasuryProposal
        - TreasuryVote
        - TreasuryVoteEvent
        - SetControllerEvent
        - LivepeerAccount
        - Round
        - Protocol
        - Transaction
      eventHandlers:
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: proposalCreated
          receipt: true
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: voteCast
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: VoteCastWithParams(indexed address,uint256,uint8,uint256,string,bytes)
          handler: voteCastWithParams
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: ProposalCanceled(uint256)
          handler: proposalCanceled
          receipt: true
        - event: ProposalQueued(uint256,uint256)
          handler: proposalQueued
          receipt: true
        - event: ProposalExecuted(uint256)
          handler: proposalExecuted
          receipt: true
        - event: SetController(address)
          handler: setController
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
  - kind: ethereum/contract
    name: ServiceRegistry
    network: {{networkName}}
    source:
      startBlock: {{contracts.serviceRegistry.startBlock}}
      address: {{contracts.serviceRegistry.address}}
      abi: ServiceRegistry
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/serviceRegistry.ts
      abis:
        - name: ServiceRegistry
