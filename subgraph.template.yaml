        - event: Burn(indexed address,uint256)
          handler: burn
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
{{#if contracts.bondingVotes}}
  - kind: ethereum/contract
    name: BondingVotes
    network: {{networkName}}
    source:
      startBlock: {{contracts.bondingVotes.startBlock}}
      address: {{contracts.bondingVotes.address}}
      abi: BondingVotes
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/bondingVotes.ts
      abis:
        - name: BondingVotes
          file: ./abis/BondingVotes.json
        - name: RoundsManager
          file: ./abis/RoundsManager.json
      entities:
        - DelegatorBondedAmountChangedEvent
        - DelegateChangedEvent
        - DelegateVotesChangedEvent
        - Protocol
        - Round
        - Transaction
      eventHandlers:
        - event: DelegatorBondedAmountChanged(indexed address,uint256,uint256,uint256,uint256)
          handler: delegatorBondedAmountChanged
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: DelegateChanged(indexed address,indexed address,indexed address)
          handler: delegateChanged
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
        - event: DelegateVotesChanged(indexed address,uint256,uint256)
          handler: delegateVotesChanged
          receipt: true
          calls:
            blockNum: RoundsManager[0x{{contracts.roundsManager.address}}].blockNum()
{{/if}}
{{#if contracts.treasury}}
  - kind: ethereum/contract
    name: TreasuryTimelock
    network: {{networkName}}
    source:
      startBlock: {{contracts.treasury.startBlock}}
      address: {{contracts.treasury.address}}
      abi: Treasury
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mappings/treasuryTimelock.ts
      abis:
        - name: Treasury
          file: ./abis/Treasury.json
        - name: RoundsManager
          file: ./abis/RoundsManager.json
      entities:
        - TreasuryCallScheduledEvent
        - TreasuryCallExecutedEvent
        - TreasuryOperationCancelledEvent
        - TreasuryMinDelayChangeEvent
        - Protocol
        - Round
        - Transaction
      eventHandlers:
